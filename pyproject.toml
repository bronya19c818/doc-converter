[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-converter"
version = "0.1.0"
description = "完全本地、无 AI 的 Markdown 到 DOCX 转换器"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "markdown-it-py>=3,<5",
  "pydantic>=2.8,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9", "mypy>=1.14", "pyinstaller>=6,<7", "types-pyyaml>=6.0.12"]

[project.scripts]
doc-converter = "doc_converter.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
