name: doc-converter

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DOC_CONVERTER_PORT:-8765}:8765"
    environment:
      DOC_CONVERTER_DATA_ROOT: /data
    volumes:
      - doc-converter-data:/data
      - type: bind
        source: ${DOC_CONVERTER_WINDOWS_FONTS:-C:/Windows/Fonts}
        target: /usr/local/share/fonts/windows
        read_only: true
    init: true
    restart: unless-stopped

volumes:
  doc-converter-data:
